<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Super Commercial - Application de Gestion Commerciale">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Super Commercial">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Super Commercial</title>
  <link rel="manifest" href="manifest.json">
  <!-- Required for mobile_scanner on web -->
  <script src="https://unpkg.com/@zxing/library@0.19.1" type="application/javascript"></script>
  <style>
    body {
      margin: 0;
      background-color: #0F172A;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #0F172A;
      z-index: 99999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      transition: opacity 0.3s ease;
    }
    .loading-logo {
      width: 100px;
      height: auto;
      margin-bottom: 24px;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.4));
      border-radius: 16px;
    }
    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #007AFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text {
      color: #94A3B8;
      margin-top: 16px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <img class="loading-logo" src="logo.png" alt="Super Commercial Logo" />
    <div class="loading-spinner"></div>
    <div class="loading-text">Chargement de Super Commercial...</div>
  </div>
  <script>
    function removeLoader() {
      var loading = document.getElementById('loading');
      if (loading && !loading.classList.contains('hidden')) {
        loading.classList.add('hidden');
        loading.style.opacity = '0';
        setTimeout(function() {
          if (loading.parentNode) {
            loading.parentNode.removeChild(loading);
          }
        }, 350);
      }
    }
    window.addEventListener('flutter-first-frame', removeLoader);
    var observer = new MutationObserver(function(mutations) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
        removeLoader();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
